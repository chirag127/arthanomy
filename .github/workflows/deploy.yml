name: CI & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, types, tests, content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Astro content types
        run: npx astro sync
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Unit tests (finance math, registries, calculators)
        run: npm test
      - name: Content validation (cross-reference registry check)
        run: npm run validate:content
      - name: Series plan is complete and current
        run: npm run content:plan -- --check
      - name: No links to unpublished briefs in article bodies
        run: npm run content:links -- --check
      - name: Article audit (frontmatter, packet scope, MDX safety)
        run: npm run content:audit

  build:
    name: Build & verify
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (Astro + Pagefind)
        run: npm run build
        env:
          SITE_URL: https://chirag127.github.io
          SITE_BASE: /arthanomy
      - name: Internal link audit
        run: npm run validate:links
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
